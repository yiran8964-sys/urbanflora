services:
  urban-flora:
    container_name: urban-flora
    image: urban-flora:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: "${APP_NAME:-urban-flora}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8081,https://urbanflora.vercel.app}"
      PORT: "8080"
      UPLOAD_DIR: /app/data/uploads
      MYSQL_DATA_DIR: /app/data/mysql
      MYSQL_DATABASE: "${MYSQL_DATABASE:-urban_flora}"
      MYSQL_USER: "${MYSQL_USER:-urban_flora}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-Abcd123456}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-Abcd123456}"
      JAVA_OPTS: "${JAVA_OPTS:-}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
